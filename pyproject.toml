[project]
name = "airbus-farm"
version = "0.1.0"
description = "Airfoil self-noise modelling and anomaly-detection notebooks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "scikit-learn>=1.6,<2",
    "xgboost>=3.4,<4",
    "torch>=2.13,<3",
    "joblib>=1.5,<2",
    "pytorch-tabnet>=4.1,<5",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
